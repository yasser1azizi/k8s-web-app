apiVersion: apps/v1
kind: Deployment

metadata:
  name: k8s-web-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: k8s-web-app

  template:
    metadata:
      labels:
        app: k8s-web-app

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000

      containers:
        - name: web-app
          image: k8s-web-app:latest
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          envFrom:
            - configMapRef:
                name: k8s-web-app-config
            - secretRef:
                name: k8s-web-app-secret

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10