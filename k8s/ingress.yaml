apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: k8s-web-app-ingress

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-web-app-service
                port:
                  number: 80

