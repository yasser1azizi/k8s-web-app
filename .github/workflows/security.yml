name: Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t k8s-web-app:ci .
      - name: Tag Docker image
        if: github.event_name == 'push'
        run: docker tag k8s-web-app:ci ghcr.io/${{ github.repository_owner }}/k8s-web-app:latest
      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push ghcr.io/${{ github.repository_owner }}/k8s-web-app:latest
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          image-ref: k8s-web-app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1